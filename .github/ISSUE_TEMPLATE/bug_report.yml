name: Bug Report
description: Report a bug of WhtsAgent Helper
labels: bug

body:
  - type: checkboxes
    id: before_you_begin
    attributes:
      label: Before You Begin
      options:
        - label: I am reporting an issue with WhtsAgent Helper itself, NOT an issue about compatibility with another app
          required: true
        - label: I searched through all [issues](https://github.com/abdulrhman-muhamad/Shizuku/issues) and confirmed that this is a new bug
          required: true
        - label: I am using the latest version of WhtsAgent Helper
          required: true

  - type: checkboxes
    id: requirements
    attributes:
      label: Requirements
      options:
        - label: WhtsAgent Helper is not running in a virtual environment or broken ROM (e.g., GrapheneOS)
          required: true
        - label: Xposed is not installed/enabled for WhtsAgent Helper
          required: true  

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - adb
        - root
        - manual
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: WhtsAgent Helper Version
    validations:
      required: true 

  - type: input
    id: android_version
    attributes:
      label: Android Version
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Issue Description
      description: Please upload any relevant logs and/or screenshots

  - type: textarea
    id: reproducer
    attributes:
      label: Steps To Reproduce
